syntax = "proto3";

package inference.v1;

service InferenceService {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  rpc StreamGenerate(GenerateRequest) returns (stream GenerationEvent);
  rpc SubscribeGeneration(SubscribeGenerationRequest) returns (stream GenerationEvent);
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message GenerateRequest {
  string model = 1;
  repeated ChatMessage messages = 2;
  string prompt = 3;
  uint64 max_tokens = 4;
  float temperature = 5;
  repeated string stop = 6;
}

message GenerateResponse {
  string request_id = 1;
  string model = 2;
  string text = 3;
  uint64 prompt_tokens = 4;
  uint64 generated_tokens = 5;
  string finish_reason = 6;
}

message SubscribeGenerationRequest {
  string request_id = 1;
  optional string after_event_id = 2;
}

message GenerationEvent {
  string request_id = 1;
  string model = 2;
  string delta = 3;
  uint64 generated_tokens = 4;
  string finish_reason = 5;
  string event_id = 6;
  string attempt_id = 7;
  uint64 prompt_tokens = 8;
  bool terminal = 9;
}
