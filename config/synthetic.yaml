frontend:
  bind_addr: "0.0.0.0:8080"

broker:
  url: "redis://127.0.0.1:6379"

model:
  id: "synthetic-fast-001"
  revision: "v1"
  endpoint: ""
  tokenizer_id: "approximate"
  tokenizer_revision: "v1"
  context_limit: 4096
  default_max_tokens: 256
  max_output_tokens: 1024

backend:
  kind: "synthetic"
  synthetic_token_delay_ms: 0

auth:
  api_keys:
    - "dev-key"

quota:
  requests_per_minute: 60000
  prompt_tokens_per_minute: 12000000
  generated_tokens_per_minute: 6000000

streams:
  active_ttl_seconds: 3600
  result_retention_seconds: 600
  lease_seconds: 60
  reclaim_idle_seconds: 90
  generation_timeout_seconds: 300

load_test:
  generate_vus: 16
  stream_vus: 8
  duration: "20s"
  request_timeout: "30s"

smoke:
  stream_max_tokens: 128
