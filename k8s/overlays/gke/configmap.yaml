apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-data-plane-config
  namespace: inference-data-plane
data:
  service.yaml: |
    frontend:
      bind_addr: "0.0.0.0:8080"

    broker:
      url: "redis://managed-valkey-required.invalid:6379"

    model:
      id: "synthetic-fast-001"
      context_limit: 4096
      default_max_tokens: 256
      max_output_tokens: 1024

    backend:
      kind: "synthetic"
      synthetic_token_delay_ms: 0

    auth:
      api_keys:
        - "dev-key"

    quota:
      requests_per_minute: 6000
      prompt_tokens_per_minute: 1200000
      generated_tokens_per_minute: 600000
