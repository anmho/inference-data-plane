apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-engine
  namespace: inference-data-plane
spec:
  template:
    spec:
      containers:
        - name: engine
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-frontend
  namespace: inference-data-plane
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
