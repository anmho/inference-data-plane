apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-engine
  namespace: inference-data-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference-engine
  template:
    metadata:
      labels:
        app: inference-engine
    spec:
      containers:
        - name: engine
          image: inference-data-plane/inference-engine:dev
          imagePullPolicy: Never
          env:
            - name: CONFIG_FILE
              value: /app/config/service.yaml
            - name: RUST_LOG
              value: info,inference_engine=debug,inference_streams=debug
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: inference-valkey-url
                  key: url
                  optional: true
          volumeMounts:
            - name: service-config
              mountPath: /app/config/service.yaml
              subPath: service.yaml
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: service-config
          configMap:
            name: inference-data-plane-config
