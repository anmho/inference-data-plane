apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: inference-frontend
  labels:
    app: inference
    component: frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: inference
        component: frontend
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"__SUBNET__"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: inference-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/inference/inference-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_FILE
              value: /app/config/service.yaml
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: TEMPORAL_ADDRESS
              value: __TEMPORAL_ADDRESS__
            - name: TEMPORAL_NAMESPACE
              value: __TEMPORAL_NAMESPACE__
            - name: TEMPORAL_TASK_QUEUE
              value: inference-gpu
            __TEMPORAL_SECRET_ENV__
            - name: MODEL_ID
              value: HuggingFaceTB/SmolLM2-135M-Instruct
            - name: MODEL_CONTEXT_LIMIT
              value: "4096"
            - name: MODEL_DEFAULT_MAX_TOKENS
              value: "256"
            - name: MODEL_MAX_OUTPUT_TOKENS
              value: "1024"
            - name: QUOTA_REQUESTS_PER_MINUTE
              value: "600"
            - name: QUOTA_PROMPT_TOKENS_PER_MINUTE
              value: "120000"
            - name: QUOTA_GENERATED_TOKENS_PER_MINUTE
              value: "60000"
            - name: GPU_BACKEND_URL
              value: __GPU_BACKEND_URL__
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: inference-valkey-url
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
  traffic:
    - latestRevision: true
      percent: 100
