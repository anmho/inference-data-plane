apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: inference-vllm-gpu
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/component: vllm-gpu
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference
        app.kubernetes.io/component: vllm-gpu
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/gpu-zonal-redundancy-disabled: "true"
    spec:
      serviceAccountName: inference-runtime@PROJECT_ID.iam.gserviceaccount.com
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-l4
      containers:
        - image: vllm/vllm-openai:v0.6.6
          ports:
            - containerPort: 8000
          args:
            - --model
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.75"
            - --max-model-len
            - "4096"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
  traffic:
    - latestRevision: true
      percent: 100
